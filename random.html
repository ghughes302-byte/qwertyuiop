<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Spinning Wheel</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            background: #f0f0f0;
        }
        #canvas-container {
            position: relative;
            margin: 20px;
        }
        /* The indicator arrow pointing at the winning slot */
        #arrow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #333;
            z-index: 10;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:disabled { background: #ccc; }
    </style>
    <style>
  .button-link{
    display: inline-block;
    padding: 10px 20px;
    background-color: #079ba9;
    color: rgb(255, 250, 250);
    text-decoration: none;
    border-radius: 5px;
  }
  .button-link:hover {
    background-color: #190cd1;
  }
</style>
</head>
<body>

    <div id="canvas-container">
        <div id="arrow"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
    </div>
    <button id="spin-btn">SPIN</button>

<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const spinBtn = document.getElementById('spin-btn');

const sectors = ['listen', 'dont listen', 'dont listen but act like you are', 'go home', 'sleep', 'dont listen and go home'];
const colors = ['#FF5733', '#33FF57', '#3357FF', '#F3FF33', '#FF33F3', '#33FFF0'];

const numSectors = sectors.length;
const arc = 2 * Math.PI / numSectors;
const radius = canvas.width / 2;

let currentAngle = 0;
let isSpinning = false;

// 1. Draw the wheel
function drawWheel() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    sectors.forEach((sector, i) => {
        const angle = currentAngle + i * arc;
        
        // Draw slice
        ctx.fillStyle = colors[i];
        ctx.beginPath();
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + arc);
        ctx.lineTo(radius, radius);
        ctx.fill();
        
        // Draw text
        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(sector, radius - 20, 10);
        ctx.restore();
    });
}

// 2. Animate the spin
function spin() {
    if (isSpinning) return;
    isSpinning = true;
    spinBtn.disabled = true;

    // Define random total rotation and duration
    const spinAngles = (Math.random() * 5 + 5) * 2 * Math.PI; // 5 to 10 full spins
    const duration = 4000; // 4 seconds
    const startTimestamp = performance.now();

    function animate(now) {
        const elapsed = now - startTimestamp;
        const progress = Math.min(elapsed / duration, 1);
        
        // Cubic ease-out formula for smooth deceleration
        const easeOut = 1 - Math.pow(1 - progress, 3);
        
        currentAngle = easeOut * spinAngles;
        drawWheel();

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            isSpinning = false;
            spinBtn.disabled = false;
            getWinningSector();
        }
    }
    requestAnimationFrame(animate);
}

// 3. Calculate winner under the top arrow (-90 degrees / -PI/2)
function getWinningSector() {
    // Normalize angle to be between 0 and 2*PI
    const normalizedAngle = (currentAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
    
    // The top indicator is at -Math.PI / 2. Find distance from start angle.
    let winningIndex = Math.floor((Math.PI * 1.5 - normalizedAngle) / arc) % numSectors;
    if (winningIndex < 0) winningIndex += numSectors;

    alert(`You won: ${sectors[winningIndex]}`);
}

// Initialize
spinBtn.addEventListener('click', spin);
drawWheel();
</script>

</body>
