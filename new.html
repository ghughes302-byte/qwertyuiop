<html>

    <body>
    <title>Button Click Counter</title>
<style>
  .button-link{
    display: inline-block;
    padding: 10px 20px;
    background-color: #079ba9;
    color: rgb(255, 250, 250);
    text-decoration: none;
    border-radius: 5px;
  }
  .button-link:hover {
    background-color: #6a7502;
  }
</style>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        h1 { color: #333; }
    </style>
<body>
    <h1>Clicks: <span id="count">0</span></h1>
    <button onclick="countClicks()">Click Me!</button>

    <script>
        let clickCount = 0;

        function countClicks() {
            clickCount++;
            document.getElementById("count").innerText = clickCount;
        }

// 1. Initialize the count variable
let count = 0;

// 2. Get references to the HTML elements
const button = document.getElementById('clickBtn');
const counterDisplay = document.getElementById('counter');

// 3. Trigger the action whenever the mouse hovers over the button
button.addEventListener('mouseenter'), () => {
    count++; // Increment the count by 1
    counterDisplay.textContent = count; // Update the UI
}
</script>
    </body>
